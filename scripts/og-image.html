<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #fff; color: #000;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { box-sizing: border-box; height: 100%; padding: 64px 80px; display: grid; grid-template-columns: 1fr 500px; gap: 56px; align-items: center; }
  .brand { display: flex; align-items: center; gap: 24px; margin-bottom: 36px; }
  .brand svg { width: 96px; height: 96px; flex: none; }
  h1 { margin: 0; font-size: 62px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  p { margin: 0 0 40px; font-size: 32px; color: #525252; line-height: 1.4; }
  .url { font-size: 26px; color: #737373; }
  .panel { border: 2px solid #d4d4d4; border-radius: 20px; padding: 18px 22px; }
  .chords { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .chords span { border: 2px solid #d4d4d4; border-radius: 10px; text-align: center; font-size: 26px; font-weight: 700; padding: 8px 0; }
  .row { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 12px; height: 70px; border-top: 2px solid #e5e5e5; }
  .row b { font-size: 20px; }
  .lane { position: relative; height: 44px; }
  .lane i { position: absolute; height: 6px; border-radius: 3px; background: #000; }
  .lane.d i { width: 8px; height: 8px; border-radius: 50%; }
  .lane.v svg { width: 100%; height: 44px; }
</style>
</head>
<body>

        <h1>Demo Track<br />Maker</h1>
      </div>

      <div class="url">ktkwmr.com/demotrackmaker</div>
    </div>
    <div class="panel">
      <div class="chords"><span>C</span><span>Am</span><span>F</span><span>G</span></div>
      <div class="row"><b>Bass</b><div class="lane">

        <i style="left:25%;top:10px;width:22%"></i><i style="left:25%;top:20px;width:22%"></i><i style="left:25%;top:30px;width:22%"></i>

      <div class="row"><b>Drums</b><div class="lane d">
        <i style="left:0%;top:32px"></i><i style="left:12.5%;top:6px"></i><i style="left:25%;top:18px"></i><i style="left:37.5%;top:6px"></i><i style="left:50%;top:32px"></i><i style="left:62.5%;top:6px"></i><i style="left:75%;top:18px"></i><i style="left:87.5%;top:6px"></i>
        <i style="left:6%;top:6px"></i><i style="left:31%;top:6px"></i><i style="left:56%;top:6px"></i><i style="left:81%;top:6px"></i></div></div>
