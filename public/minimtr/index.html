<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Multitrack Recorder in Your Browser – MiniMTR</title>
<meta name="description" content="Record and overdub multiple audio tracks in your browser. Mix with volume, pan, mute and solo, then export the project (WAV + settings) to your computer and continue later. Free, no sign-up." />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="MiniMTR" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<style>
  :root {
    --bg: #ffffff; --fg: #111111; --muted: #5f5f5f; --line: #d6d6d6; --soft: #f3f3f3;
    --lane: #fafafa; --wave: #222222; --wave-dim: #b5b5b5; --rec: #d4002a; --accent: #111111;
    --head-h: 52px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212; --fg: #f0f0f0; --muted: #a8a8a8; --line: #3a3a3a; --soft: #1f1f1f;
    --lane: #181818; --wave: #e8e8e8; --wave-dim: #5c5c5c; --rec: #ff4d6a; --accent: #f0f0f0; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212; --fg: #f0f0f0; --muted: #a8a8a8; --line: #3a3a3a; --soft: #1f1f1f;
    --lane: #181818; --wave: #e8e8e8; --wave-dim: #5c5c5c; --rec: #ff4d6a; --accent: #f0f0f0; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  button, input, select { font: inherit; color: inherit; }
  button {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
    cursor: pointer; min-height: 36px; transition: transform .08s, background .08s;
  }
  button:hover:not(:disabled) { background: var(--soft); }
  button:disabled { opacity: .4; cursor: default; }
  button.is-pressed:not(:disabled) { transform: scale(.94); background: var(--line); }
  @media (prefers-reduced-motion: reduce) { button.is-pressed:not(:disabled) { transform: none; } }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon-btn { width: 40px; padding: 0; display: inline-grid; place-items: center; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  header.top {
    position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line);
    padding: calc(8px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
    display: flex; align-items: center; gap: 10px;
  }
  .brand { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .brand svg { width: 22px; height: 22px; }
  .spacer { flex: 1; }
  #saveStatus { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  main { padding: 12px max(12px, env(safe-area-inset-right)) 24px max(12px, env(safe-area-inset-left)); max-width: 1200px; margin: 0 auto; }

  /* Transport */
  .transport {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--soft);
  }
  .tbtns { display: flex; gap: 6px; }
  .tbtns button { width: 48px; height: 44px; padding: 0; display: grid; place-items: center; }
  #recBtn svg.i { stroke: var(--rec); }
  #recBtn.on { background: var(--rec); border-color: var(--rec); }
  #recBtn.on svg.i { stroke: #fff; fill: #fff; }
  #playBtn.on { background: var(--fg); color: var(--bg); }
  .clock { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; line-height: 1.2; min-width: 110px; }
  .clock .t { font-size: 22px; font-weight: 600; }
  .clock .b { font-size: 12px; color: var(--muted); }
  .tset { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .tset label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .tset input[type=number] { width: 64px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  .tset select { padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  .toggle[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .meter { width: 90px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .meter > i { display: block; height: 100%; width: 0; background: var(--fg); transition: width .05s; }
  .meter.hot > i { background: var(--rec); }

  /* Project bar */
  .projbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0; }
  .projbar .label { font-size: 13px; color: var(--muted); margin-right: 4px; }
  .projbar input.pname { min-width: 0; width: 180px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .projbar .grp { display: flex; flex-wrap: wrap; gap: 6px; }
  .confirm { background: var(--rec) !important; color: #fff !important; border-color: var(--rec) !important; }

  /* Tracks */
  .ruler-row, .track { display: grid; grid-template-columns: 290px 1fr; gap: 0; }
  .ruler-row .pad { border-bottom: 1px solid var(--line); }
  .lane-wrap { position: relative; min-width: 0; }
  canvas.ruler { display: block; width: 100%; height: 24px; border-bottom: 1px solid var(--line); cursor: pointer; touch-action: none; }
  .tracks { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .track { border-bottom: 1px solid var(--line); }
  .track:last-child { border-bottom: 0; }
  .ctl { padding: 8px; border-right: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; background: var(--bg); min-width: 0; }
  .ctl .row { display: flex; align-items: center; gap: 4px; }
  .ctl input.tname { flex: 1; width: 0; min-width: 0; padding: 4px 6px; border: 1px solid transparent; border-radius: 6px; background: transparent; font-weight: 600; }
  .ctl input.tname:hover, .ctl input.tname:focus { border-color: var(--line); }
  .ctl .sbtn { min-width: 32px; min-height: 30px; padding: 2px 6px; font-size: 13px; font-weight: 700; }
  .sbtn.arm[aria-pressed="true"] { background: var(--rec); color: #fff; border-color: var(--rec); }
  .sbtn.mute[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .sbtn.solo[aria-pressed="true"] { background: #e8b400; color: #111; border-color: #e8b400; }
  .ctl .sl { display: grid; grid-template-columns: 28px 1fr 34px; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .ctl .sl output { text-align: right; font-variant-numeric: tabular-nums; }
  .ctl input[type=range] { width: 100%; accent-color: var(--fg); }
  .lane { position: relative; background: var(--lane); cursor: pointer; touch-action: none; min-height: 108px; }
  .lane canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .lane .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; pointer-events: none; text-align: center; padding: 0 8px; }
  .lane .empty[hidden] { display: none; }
  .playhead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--rec); pointer-events: none; z-index: 2; }
  .menu-wrap { position: relative; }
  .tmenu { position: absolute; right: 0; top: 100%; z-index: 15; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 4px; min-width: 210px; box-shadow: 0 6px 24px rgba(0,0,0,.15); display: grid; }
  .tmenu[hidden] { display: none; }
  .tmenu button, .tmenu a { border: 0; text-align: left; border-radius: 6px; min-height: 36px; padding: 6px 10px; background: transparent; color: inherit; text-decoration: none; display: block; font-size: 14px; }
  .tmenu button:hover, .tmenu a:hover, .tmenu button:focus, .tmenu a:focus { background: var(--soft); outline: none; }
  .addrow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  /* Intro */
  .intro { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--fg); max-width: 760px; }
  .intro h1 { font-size: 20px; margin: 0 0 8px; }
  .intro p { margin: 0 0 10px; color: var(--muted); }

  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--fg); padding: 20px; max-width: min(560px, calc(100vw - 32px)); }
  dialog:focus { outline: none; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog h2 { margin: 0 0 10px; font-size: 18px; }
  dialog p, dialog li { color: var(--muted); }
  dialog .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: calc(100vw - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.show { opacity: 1; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 720px) {
    .ruler-row, .track { grid-template-columns: 1fr; }
    .ruler-row .pad { display: none; }
    .ctl { border-right: 0; border-bottom: 1px solid var(--line); grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .ctl .row:first-child { grid-column: 1 / -1; }
    .lane { min-height: 84px; }
    .clock .t { font-size: 20px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" class="i" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8v8M11 10v4M15 7v10M19 11v2" stroke-width="1.8"/></svg>
    <span>MiniMTR</span>
  </div>
  <span id="saveStatus" aria-live="polite"></span>
  <span class="spacer"></span>
  <div class="menu-wrap">
    <button id="settingsBtn" class="icon-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="settingsMenu" data-i18n-attr="aria-label:menu.settings">
      <svg viewBox="0 0 24 24" class="i" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <div id="settingsMenu" class="tmenu" role="menu" hidden>
      <button role="menuitem" data-open="helpDlg" data-i18n="menu.help">How to use</button>
      <button role="menuitem" data-open="latDlg" data-i18n="menu.latency">Recording latency</button>
      <button role="menuitem" data-open="privacyDlg" data-i18n="menu.privacy">Privacy</button>
      <button role="menuitem" data-open="aboutDlg" data-i18n="menu.about">About this app</button>
    </div>
  </div>
</header>

<main>
  <section class="transport" aria-label="Transport">
    <div class="tbtns">
      <button id="homeBtn" data-i18n-attr="aria-label:tr.home"><svg viewBox="0 0 24 24" class="i" aria-hidden="true"><path d="M6 5v14M19 5 9 12l10 7z"/></svg></button>
      <button id="playBtn" data-i18n-attr="aria-label:tr.play"><svg viewBox="0 0 24 24" class="i" aria-hidden="true"><path id="playIcon" d="M7 4l13 8-13 8z"/></svg></button>
      <button id="stopBtn" data-i18n-attr="aria-label:tr.stop"><svg viewBox="0 0 24 24" class="i" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
      <button id="recBtn" data-i18n-attr="aria-label:tr.rec"><svg viewBox="0 0 24 24" class="i" aria-hidden="true"><circle cx="12" cy="12" r="6"/></svg></button>
    </div>
    <div class="clock" aria-live="off"><div class="t" id="clockT">00:00.000</div><div class="b" id="clockB">1.1</div></div>
    <div class="tset">
      <label><span data-i18n="tr.bpm">BPM</span> <input id="bpm" type="number" min="30" max="300" step="1" value="120" /></label>
      <label><span data-i18n="tr.beats">Beats</span>
        <select id="beats"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option></select>
      </label>
      <button id="metroBtn" class="toggle" aria-pressed="false" data-i18n="tr.metro">Click</button>
      <button id="countBtn" class="toggle" aria-pressed="true" data-i18n="tr.countin">Count-in</button>
      <label><span data-i18n="tr.input">Input</span> <span class="meter" id="meter"><i></i></span></label>
      <button id="undoBtn" disabled data-i18n="tr.undo">Undo</button>
    </div>
  </section>

  <section class="projbar" aria-label="Project">
    <span class="label" data-i18n="pj.label">Project</span>
    <input id="pname" class="pname" type="text" maxlength="60" data-i18n-attr="aria-label:pj.name" />
    <div class="grp">
      <button id="exportBtn" data-i18n="pj.export">Export project (.zip)</button>
      <button id="importBtn" data-i18n="pj.import">Open project…</button>
      <button id="folderSaveBtn" hidden data-i18n="pj.folderSave">Save to folder</button>
      <button id="folderOpenBtn" hidden data-i18n="pj.folderOpen">Open folder…</button>
      <button id="mixBtn" data-i18n="pj.mix">Mixdown (WAV)</button>
      <button id="newBtn" data-i18n="pj.new">New</button>
    </div>
    <input id="projectFile" type="file" accept=".zip,application/zip" hidden />
    <input id="audioFile" type="file" accept="audio/*,.wav,.mp3,.m4a,.aac,.ogg,.flac" hidden />
  </section>

  <section class="tracks" aria-label="Tracks">
    <div class="ruler-row"><div class="pad"></div><div class="lane-wrap"><canvas class="ruler" id="ruler"></canvas></div></div>
    <div id="trackList"></div>
  </section>
  <div class="addrow">
    <button id="addTrackBtn" data-i18n="tk.add">+ Add track</button>
  </div>

  <section class="intro">
    <h1 data-i18n="intro.title">Multitrack recorder in your browser</h1>
    <div data-i18n-html="intro.body"></div>
  </section>
</main>

<dialog id="helpDlg" tabindex="-1" aria-labelledby="helpTitle">
  <h2 id="helpTitle" data-i18n="help.title">How to use</h2>
  <div data-i18n-html="help.body"></div>
  <div class="acts"><button data-close data-i18n="dlg.close">Close</button></div>
</dialog>
<dialog id="latDlg" tabindex="-1" aria-labelledby="latTitle">
  <h2 id="latTitle" data-i18n="lat.title">Recording latency</h2>
  <p data-i18n="lat.body"></p>
  <p><label><span data-i18n="lat.label">Offset (ms)</span> <input id="latMs" type="number" min="-500" max="1000" step="1" style="width:90px" /></label>
    <button id="latAuto" data-i18n="lat.auto">Auto</button></p>
  <p id="latInfo" style="font-size:13px"></p>
  <div class="acts"><button data-close data-i18n="dlg.close">Close</button></div>
</dialog>
<dialog id="privacyDlg" tabindex="-1" aria-labelledby="privTitle">
  <h2 id="privTitle" data-i18n="privacy.title">Privacy</h2>
  <div data-i18n-html="privacy.body"></div>
  <div class="acts"><button data-close data-i18n="dlg.close">Close</button></div>
</dialog>
<dialog id="aboutDlg" tabindex="-1" aria-labelledby="aboutTitle">
  <h2 id="aboutTitle" data-i18n="about.title">About this app</h2>
  <div data-i18n-html="about.body"></div>
  <div class="acts"><button data-close data-i18n="dlg.close">Close</button></div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

  more.setAttribute("aria-label", t("tk.more"));
  q(".m-import").textContent = t("tk.importAudio");
  q(".m-export").textContent = t("tk.exportWav");
  q(".m-clear").textContent = t("tk.clear");
  q(".m-delete").textContent = t("tk.delete");
  setupMenu(more, menu);
  q(".m-import").addEventListener("click", () => { closeMenus(); pendingImportTrack = tr; $("#audioFile").value = ""; $("#audioFile").click(); });
  q(".m-export").addEventListener("click", () => {
    closeMenus(); materializePending();
    if (!tr.buffer) { toast(t("msg.nothing")); return; }
    saveFile(new Blob([encodeWav(tr.buffer, true)], { type: "audio/wav" }), `${projectBase()}-${safeName(tr.name)}.wav`);
  });
  const clearBtn = q(".m-clear"), delBtn = q(".m-delete");
  twoTap(clearBtn, "tk.clear", () => { closeMenus(); undoInfo = { trackId: tr.id, buffer: tr.buffer }; $("#undoBtn").disabled = !tr.buffer; tr.buffer = null; tr.rev++; markAudioDirty(tr); drawAll(); });
  twoTap(delBtn, "tk.delete", () => {
    closeMenus();
    if (tr.gain) tr.gain.disconnect(); if (tr.panner) tr.panner.disconnect();
    state.tracks = state.tracks.filter((x) => x !== tr);
    if (!state.tracks.length) state.tracks.push(newTrack(1));
    audioDel(tr.id).catch(() => {});
    if (undoInfo && undoInfo.trackId === tr.id) { undoInfo = null; $("#undoBtn").disabled = true; }
    releaseMicIfUnused(); updateAllMix(); renderAll(); saveSoon();
  });
  // seek on lane
  const lane = q(".lane");
  attachSeek(lane);
  q(".empty").textContent = t("tk.empty");
  return el;
}
function attachSeek(target) {
  const toSec = (e) => { const r = target.getBoundingClientRect(); return ((e.clientX - r.left) / r.width) * timelineLen(); };
  target.addEventListener("pointerdown", (e) => {
    if (transport.recording || e.button > 0) return;
    target.setPointerCapture(e.pointerId);
    seek(toSec(e));
    const move = (ev) => seek(toSec(ev));
    const up = () => { target.removeEventListener("pointermove", move); target.removeEventListener("pointerup", up); target.removeEventListener("pointercancel", up); };
    target.addEventListener("pointermove", move); target.addEventListener("pointerup", up); target.addEventListener("pointercancel", up);
  });
}
// menus
function closeMenus(except) {
  document.querySelectorAll(".tmenu").forEach((m) => { if (m !== except) { m.hidden = true; const b = m.previousElementSibling; if (b) b.setAttribute("aria-expanded", "false"); } });
}
function setupMenu(btn, menu) {
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = menu.hidden;
    closeMenus(menu);
    menu.hidden = !open; btn.setAttribute("aria-expanded", open);
    if (open) menu.querySelector("[role=menuitem]").focus();
  });
  menu.addEventListener("keydown", (e) => {
    const items = [...menu.querySelectorAll("[role=menuitem]")];
    const i = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (e.key === "Escape") { closeMenus(); btn.focus(); }
  });
}
document.addEventListener("click", (e) => { if (!e.target.closest(".menu-wrap")) closeMenus(); });

// ---------------------------------------------------------------- drawing
const peakCache = new WeakMap();
function timelineLen() {
  let longest = 0;
  for (const tr of state.tracks) if (tr.buffer) longest = Math.max(longest, tr.buffer.duration);
  const bar = (60 / state.bpm) * state.beats;
  const want = Math.max(30, longest + 4, curPos() + 4);
  return Math.ceil(want / bar) * bar;
}
let drawnLen = 0;
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawAll() {
  const L = timelineLen();
  drawnLen = L;
  drawRuler(L);
  for (const tr of state.tracks) drawTrack(tr, L);
  drawPlayheads();
  updateClock();
}
function fitCanvas(c) {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(c.clientWidth * dpr)), h = Math.max(1, Math.round(c.clientHeight * dpr));
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  return { w, h, dpr };
}
function drawRuler(L) {
  const c = $("#ruler"); const { w, h, dpr } = fitCanvas(c); const g = c.getContext("2d");
  g.clearRect(0, 0, w, h);
  const bar = (60 / state.bpm) * state.beats;
  const pxPerBar = (w / L) * bar;
  const step = Math.max(1, Math.ceil((44 * dpr) / pxPerBar));
  g.fillStyle = cssVar("--muted"); g.strokeStyle = cssVar("--line");
  g.font = `${11 * dpr}px system-ui, sans-serif`; g.textBaseline = "middle";
  for (let b = 0; b * bar <= L; b++) {
    const x = Math.round((b * bar / L) * w) + 0.5;
    g.beginPath(); g.moveTo(x, b % step === 0 ? h * 0.35 : h * 0.7); g.lineTo(x, h); g.stroke();
    if (b % step === 0) g.fillText(String(b + 1), x + 3 * dpr, h * 0.4);
  }
}
function drawTrack(tr, L) {
  const el = trackList.querySelector(`.track[data-id="${tr.id}"]`);
  if (!el) return;
  const c = el.querySelector("canvas"); const { w, h, dpr } = fitCanvas(c); const g = c.getContext("2d");
  el.querySelector(".empty").hidden = !!(tr.buffer || tr.pending);
  g.clearRect(0, 0, w, h);
  // bar grid
  const bar = (60 / state.bpm) * state.beats;
  g.strokeStyle = cssVar("--line"); g.lineWidth = 1;
  for (let b = 1; b * bar < L; b++) { const x = Math.round((b * bar / L) * w) + 0.5; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  if (!tr.buffer) return;
  const buf = tr.buffer;
  const px = Math.max(1, Math.round((buf.duration / L) * w));
  let pc = peakCache.get(buf);
  if (!pc || pc.px !== px) {
    const data = buf.getChannelData(0);
    const data2 = buf.numberOfChannels > 1 ? buf.getChannelData(1) : null;
    const per = buf.length / px;
    const mins = new Float32Array(px), maxs = new Float32Array(px);
    for (let i = 0; i < px; i++) {
      const s = Math.floor(i * per), e = Math.min(buf.length, Math.floor((i + 1) * per));
      let mn = 0, mx = 0;
      const stride = Math.max(1, Math.floor((e - s) / 400));
      for (let j = s; j < e; j += stride) { const v = data2 ? (data[j] + data2[j]) / 2 : data[j]; if (v < mn) mn = v; if (v > mx) mx = v; }
      mins[i] = mn; maxs[i] = mx;
    }
    pc = { px, mins, maxs };
    peakCache.set(buf, pc);
  }
  const mid = h / 2;
  g.fillStyle = audibleGain(tr) > 0 ? cssVar("--wave") : cssVar("--wave-dim");
  for (let i = 0; i < px; i++) {
    const y1 = mid - pc.maxs[i] * mid * 0.95, y2 = mid - pc.mins[i] * mid * 0.95;
    g.fillRect(i, y1, 1, Math.max(dpr, y2 - y1));
  }
}
function drawPlayheads() {
  const L = drawnLen || timelineLen();
  const p = Math.max(0, curPos());
  const pct = Math.min(100, (p / L) * 100) + "%";
  document.querySelectorAll(".playhead").forEach((ph) => (ph.style.left = pct));
}
function updateClock() {
  const p = curPos();
  $("#clockT").textContent = fmtTime(p);
  const beat = 60 / state.bpm;
  const b = Math.floor(p / beat);
  const barN = Math.floor(b / state.beats) + 1, beatN = (((b % state.beats) + state.beats) % state.beats) + 1;
  $("#clockB").textContent = (p < 0 ? "count " : "") + barN + "." + beatN;
}
function frame() {
  if (!transport.playing) return;
  if (curPos() > drawnLen - 1) drawAll();
  else { drawPlayheads(); updateClock(); }
  requestAnimationFrame(frame);
}
function updateTransportUi() {
  $("#playBtn").classList.toggle("on", transport.playing && !transport.recording);
  $("#recBtn").classList.toggle("on", transport.recording);
  $("#playIcon").setAttribute("d", transport.playing ? "M8 5v14M16 5v14" : "M7 4l13 8-13 8z");
  const busy = transport.recording;
  ["#exportBtn", "#importBtn", "#folderSaveBtn", "#folderOpenBtn", "#mixBtn", "#newBtn", "#addTrackBtn", "#homeBtn"].forEach((s) => ($(s).disabled = busy));
  $("#undoBtn").disabled = busy || !undoInfo;
}
let resizeT;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(drawAll, 100); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", drawAll);

// ---------------------------------------------------------------- dialogs
let lastOpener = null;
function openDlg(id, opener) {
  const d = document.getElementById(id);
  lastOpener = opener;
  closeMenus();
  if (id === "latDlg") fillLatency();
  d.showModal(); d.focus();
}
document.querySelectorAll("dialog").forEach((d) => {
  d.addEventListener("close", () => { (lastOpener && lastOpener.offsetParent ? lastOpener : $("#settingsBtn")).focus(); });
  d.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => d.close()));
  d.addEventListener("click", (e) => { if (e.target === d) d.close(); });
});
document.querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", () => openDlg(b.dataset.open, b)));
setupMenu($("#settingsBtn"), $("#settingsMenu"));
function fillLatency() {
  const p = latencyParts();
  $("#latMs").value = state.latencyMs == null ? p.total : state.latencyMs;
  $("#latInfo").textContent = t("lat.info", { ms: p.total, out: p.out, inp: p.inp, proc: p.proc });
}
$("#latMs").addEventListener("change", () => { const v = clamp(+$("#latMs").value, -500, 1000, null); state.latencyMs = v; saveSoon(); });
$("#latAuto").addEventListener("click", () => { state.latencyMs = null; fillLatency(); saveSoon(); });

// ---------------------------------------------------------------- wiring
$("#playBtn").addEventListener("click", () => (transport.playing ? pause() : play()));
$("#stopBtn").addEventListener("click", stopAll);
$("#homeBtn").addEventListener("click", () => seek(0));
$("#recBtn").addEventListener("click", () => (transport.recording ? stopRecording() : startRecording()));
$("#undoBtn").addEventListener("click", undo);
$("#bpm").addEventListener("change", () => { state.bpm = clamp(+$("#bpm").value, 30, 300, 120); $("#bpm").value = state.bpm; drawAll(); saveSoon(); });
$("#beats").addEventListener("change", () => { state.beats = +$("#beats").value; drawAll(); saveSoon(); });
$("#metroBtn").addEventListener("click", () => { state.metronome = !state.metronome; $("#metroBtn").setAttribute("aria-pressed", state.metronome); saveSoon(); });
$("#countBtn").addEventListener("click", () => { state.countIn = !state.countIn; $("#countBtn").setAttribute("aria-pressed", state.countIn); saveSoon(); });
$("#pname").addEventListener("change", () => { state.name = $("#pname").value.trim(); saveSoon(); });
$("#addTrackBtn").addEventListener("click", () => {
  if (state.tracks.length >= MAX_TRACKS) { toast(t("msg.maxTracks", { n: MAX_TRACKS })); return; }
  const tr = newTrack(state.tracks.length + 1);
  state.tracks.push(tr); buildTrackNodes(tr);
  renderAll(); saveSoon();
});
$("#exportBtn").addEventListener("click", exportProject);
$("#importBtn").addEventListener("click", () => { $("#projectFile").value = ""; $("#projectFile").click(); });
$("#projectFile").addEventListener("change", (e) => { const f = e.target.files[0]; if (f) importProjectFile(f); });
$("#audioFile").addEventListener("change", async (e) => {
  const f = e.target.files[0], tr = pendingImportTrack; pendingImportTrack = null;
  if (!f || !tr) return;
  try {
    const buf = await decodeAudioFile(new Uint8Array(await f.arrayBuffer()));
    undoInfo = { trackId: tr.id, buffer: tr.buffer }; $("#undoBtn").disabled = false;
    tr.buffer = buf; tr.rev++;
    if (/^(Track|トラック) \d+$/.test(tr.name)) tr.name = f.name.replace(/\.[^.]+$/, "").slice(0, 40);
    markAudioDirty(tr); renderAll();
  } catch (err) { console.warn(err); toast(t("msg.decodeFail")); }
});
$("#mixBtn").addEventListener("click", mixdown);
const newBtn = $("#newBtn"); newBtn.dataset.confirmKey = "pj.confirmNew";
twoTap(newBtn, "pj.new", async () => {
  if (transport.playing) stopAll();
  for (const tr of state.tracks) { if (tr.gain) tr.gain.disconnect(); if (tr.panner) tr.panner.disconnect(); }
  Object.assign(state, { name: "", bpm: 120, beats: 4, metronome: false, countIn: true, latencyMs: state.latencyMs, tracks: [1, 2, 3, 4].map(newTrack) });
  state.tracks.forEach(buildTrackNodes);
  undoInfo = null; transport.pos = 0; dirHandle = null;
  try { await audioClear(); await kvDel("dirHandle"); } catch {}
  updateFolderUi(); releaseMicIfUnused(); renderAll(); saveSoon();
});
if (fsSupported) {
  $("#folderSaveBtn").hidden = false; $("#folderOpenBtn").hidden = false;
  $("#folderSaveBtn").addEventListener("click", (e) => folderSave(e.shiftKey));
  $("#folderOpenBtn").addEventListener("click", folderOpen);
}
attachSeek($("#ruler"));
// Keyboard: space = play/pause, R = record, Home = start
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, select, textarea, dialog[open]") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === "Space") { e.preventDefault(); transport.playing ? pause() : play(); }
  else if (e.key === "r" || e.key === "R") { e.preventDefault(); transport.recording ? stopRecording() : startRecording(); }
  else if (e.key === "Home") { e.preventDefault(); seek(0); }
});

// ---------------------------------------------------------------- start
applyI18n();
(async () => {
  const ok = await restore();
  if (!ok) state.tracks = [1, 2, 3, 4].map(newTrack);
  materializePending();
  if (fsSupported) { try { const h = await kvGet("dirHandle"); if (h) dirHandle = h; } catch {} updateFolderUi(); }
  renderAll();
  if (ok) $("#saveStatus").textContent = t("st.saved", { time: "" }).trim();
})();
</script>
<script>
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
